name: Build XXKSU-SUSFS Kernel

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
  push:
    branches:
      - floppy-unity # Triggers automatically when you push to the floppy-unity branch

jobs:
  build:
    name: Build Kernel (XXKSU-SUSFS)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 wget

      - name: Setup Cache (ccache & toolchains)
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ../toolchains
          key: ${{ runner.os }}-kernel-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-build-

      - name: Configure Telegram Secrets
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            echo "$TG_BOT_TOKEN" > ../bot_token
            echo "$TG_CHAT_ID" > ../chat_test
          fi

      - name: Compile Kernel
        run: |
          # Set toolchain type to aosp (the script will download it automatically)
          export CLANG_TYPE=aosp
          # Set WP (workspace path) to the parent directory
          export WP=$(realpath ..)
          
          # Configure ccache parameters for optimal size (10GB)
          ccache -M 10G
          
          # Run the build script for unified mitrinket target with the 'x' (XXKSU-SUSFS) option
          # Also add 't' flag for Telegram upload if credentials are provided
          if [ -f ../bot_token ]; then
            ./do_build.sh mitrinket xt
          else
            ./do_build.sh mitrinket x
          fi

      - name: Unpack Flashable Zip
        run: |
          mkdir -p build/unpacked
          unzip build/Floppy_*.zip -d build/unpacked

      - name: Upload Kernel Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-XXKSU-SUSFS-mitrinket
          path: build/unpacked/
